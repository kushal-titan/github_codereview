name: "Automated Code Quality Monitor"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  statuses: write

jobs:
  code-quality-gate:
    name: "Roslyn AST Quality Analysis & Alerting"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: write
      statuses: write

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for git diff against base branch

      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🔨 Restore & Build Code Monitor
        run: |
          dotnet restore src/CodeMonitor/CodeMonitor.csproj
          dotnet build src/CodeMonitor/CodeMonitor.csproj -c Release

      - name: 🔍 Resolve PR Author Email
        id: resolve_author
        run: |
          # 1. Try to get author email from the latest commit in the PR branch
          COMMIT_EMAIL=$(git log -1 --format='%ae')
          COMMIT_NAME=$(git log -1 --format='%an')
          echo "Detected Commit Author: $COMMIT_NAME <$COMMIT_EMAIL>"
          
          # Fallback to GitHub event author if available
          AUTHOR_EMAIL="${COMMIT_EMAIL}"
          if [ -z "$AUTHOR_EMAIL" ] || [ "$AUTHOR_EMAIL" = "null" ]; then
            AUTHOR_EMAIL="${{ github.event.pull_request.user.email || github.event.pusher.email }}"
          fi
          
          echo "Target PR Author Mail: $AUTHOR_EMAIL"
          echo "email=$AUTHOR_EMAIL" >> $GITHUB_OUTPUT

      - name: 🛡️ Run Quality Gate & AST Analyzer
        id: run_analyzer
        continue-on-error: true
        env:
          # Git context
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR_EMAIL: ${{ steps.resolve_author.outputs.email }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          
          # Outlook / Microsoft 365 SMTP Credentials
          OUTLOOK_SENDER_EMAIL: ${{ secrets.OUTLOOK_SENDER_EMAIL }}
          OUTLOOK_APP_PASSWORD: ${{ secrets.OUTLOOK_APP_PASSWORD }}
          OUTLOOK_ADDITIONAL_RECIPIENTS: ${{ secrets.OUTLOOK_ADDITIONAL_RECIPIENTS }}
          OUTLOOK_LEAD_EMAIL: ${{ secrets.OUTLOOK_LEAD_EMAIL }}
          OUTLOOK_MANAGER_EMAIL: ${{ secrets.OUTLOOK_MANAGER_EMAIL }}
          OUTLOOK_SMTP_SERVER: "smtp.office365.com"
          OUTLOOK_SMTP_PORT: 587
        run: |
          echo "Analyzing changes against base: $BASE_REF for PR Author: $PR_AUTHOR_EMAIL"
          echo "Workspace: $GITHUB_WORKSPACE"
          dotnet run --project src/CodeMonitor/CodeMonitor.csproj -c Release -f net8.0 --no-build -- \
            --path "$GITHUB_WORKSPACE" \
            --base-ref "$BASE_REF" \
            --pr-number "$PR_NUMBER" \
            --pr-url "$PR_URL" \
            --pr-author "$PR_AUTHOR_EMAIL"

      - name: 💬 Post or Update PR Quality Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('pr-comment.md')) {
              const body = fs.readFileSync('pr-comment.md', 'utf8');
              try {
                const { data: comments } = await github.rest.issues.listComments({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                });
                
                const botComment = comments.find(comment => 
                  comment.body.includes('Code Quality Gate:') || 
                  comment.body.includes('Code Quality Check:')
                );
                
                if (botComment) {
                  await github.rest.issues.updateComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: botComment.id,
                    body: body
                  });
                  console.log('✅ Updated existing PR quality comment.');
                } else {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    body: body
                  });
                  console.log('✅ Created new PR quality comment.');
                }
              } catch (err) {
                console.log('⚠️ Could not post PR comment:', err.message);
              }
            }

      - name: 📋 File GitHub Issue for Blocking Errors
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const errorFile = 'issues/latest_errors.md';
            if (fs.existsSync(errorFile)) {
              const body = fs.readFileSync(errorFile, 'utf8');
              if (body.includes('Summary of Critical Blocking Errors') || body.includes('Action Required') || body.includes('❌ **Error**')) {
                const prNumber = context.payload.pull_request ? context.payload.pull_request.number : '';
                const prAuthor = context.payload.pull_request ? context.payload.pull_request.user.login : context.actor;
                
                const now = new Date();
                const istOffset = 5.5 * 60 * 60 * 1000;
                const istDate = new Date(now.getTime() + istOffset);
                const timeString = istDate.toISOString().replace('T', ' ').substring(0, 19) + ' IST';
                const title = prNumber 
                  ? `❌ Code Quality Blocking Errors [PR #${prNumber}] - ${timeString}`
                  : `❌ Code Quality Blocking Errors - ${timeString}`;
                  
                console.log(`🚀 Creating GitHub Issue for blocking errors: ${title}`);
                console.log(`👤 Assignee (PR Author): ${prAuthor}`);
                
                const issuePayload = {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: title,
                  body: body,
                  assignees: prAuthor ? [prAuthor] : []
                };
                
                try {
                  const issue = await github.rest.issues.create(issuePayload);
                  console.log(`✅ Successfully created GitHub Issue #${issue.data.number} assigned to @${prAuthor}: ${issue.data.html_url}`);
                } catch (err) {
                  console.log('⚠️ Failed with assignees in create, attempting fallback:', err.message);
                  delete issuePayload.assignees;
                  try {
                    const fallbackIssue = await github.rest.issues.create(issuePayload);
                    console.log(`✅ Created fallback GitHub Issue #${fallbackIssue.data.number}: ${fallbackIssue.data.html_url}`);
                    if (prAuthor) {
                      await github.rest.issues.addAssignees({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: fallbackIssue.data.number,
                        assignees: [prAuthor]
                      });
                      console.log(`✅ Added assignee @${prAuthor} via addAssignees.`);
                    }
                  } catch (fallbackErr) {
                    console.log('❌ Could not create GitHub Issue:', fallbackErr.message);
                  }
                }
              } else {
                console.log('✅ 0 critical blocking errors detected in issues/latest_errors.md. Skipping issue creation.');
              }
            } else {
              console.log('ℹ️ No issues/latest_errors.md found.');
            }

      - name: 💾 Commit & Push Error Report to Branch
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -d "issues" ] && [ -n "$(ls -A issues/errors_*.md 2>/dev/null)" ]; then
            echo "Committing generated error report (.md) to branch..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add issues/
            git commit -m "chore(quality): save error report (.md) [skip ci]" || echo "No new files to commit"
            git push origin HEAD:${{ github.head_ref }} || echo "Could not push directly to branch"
          fi

      - name: 📦 Archive Quality Reports Artifacts (.md)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-report
          path: issues/
          if-no-files-found: ignore

      - name: 🚨 Evaluate Quality Gate Result
        if: always()
        run: |
          if [ "${{ steps.run_analyzer.outcome }}" != "success" ]; then
            echo "❌ Quality Gate failed due to critical code quality violations."
            exit 1
          else
            echo "✅ Quality Gate passed."
          fi
