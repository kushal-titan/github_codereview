name: "Automated Code Quality Monitor"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - master
      - develop

jobs:
  code-quality-gate:
    name: "Roslyn AST Quality Analysis & Alerting"
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      checks: write
      issues: write

    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history required for git diff against base branch

      - name: ⚙️ Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 🔨 Restore & Build Code Monitor
        run: |
          dotnet restore src/CodeMonitor/CodeMonitor.csproj
          dotnet build src/CodeMonitor/CodeMonitor.csproj -c Release

      - name: 🔍 Resolve PR Author Email
        id: resolve_author
        run: |
          # 1. Try to get author email from the latest commit in the PR branch
          COMMIT_EMAIL=$(git log -1 --format='%ae')
          COMMIT_NAME=$(git log -1 --format='%an')
          echo "Detected Commit Author: $COMMIT_NAME <$COMMIT_EMAIL>"
          
          # Fallback to GitHub event author if available
          AUTHOR_EMAIL="${COMMIT_EMAIL}"
          if [ -z "$AUTHOR_EMAIL" ] || [ "$AUTHOR_EMAIL" = "null" ]; then
            AUTHOR_EMAIL="${{ github.event.pull_request.user.email || github.event.pusher.email }}"
          fi
          
          echo "Target PR Author Mail: $AUTHOR_EMAIL"
          echo "email=$AUTHOR_EMAIL" >> $GITHUB_OUTPUT

      - name: 🛡️ Run Quality Gate & AST Analyzer
        env:
          # Git context
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR_EMAIL: ${{ steps.resolve_author.outputs.email }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
          
          # Outlook / Microsoft 365 SMTP Credentials
          OUTLOOK_SENDER_EMAIL: ${{ secrets.OUTLOOK_SENDER_EMAIL }}
          OUTLOOK_APP_PASSWORD: ${{ secrets.OUTLOOK_APP_PASSWORD }}
          OUTLOOK_ADDITIONAL_RECIPIENTS: ${{ secrets.OUTLOOK_ADDITIONAL_RECIPIENTS }}
          OUTLOOK_LEAD_EMAIL: ${{ secrets.OUTLOOK_LEAD_EMAIL }}
          OUTLOOK_MANAGER_EMAIL: ${{ secrets.OUTLOOK_MANAGER_EMAIL }}
          OUTLOOK_SMTP_SERVER: "smtp.office365.com"
          OUTLOOK_SMTP_PORT: 587
        run: |
          echo "Analyzing changes against base: $BASE_REF for PR Author: $PR_AUTHOR_EMAIL"
          echo "Workspace: $GITHUB_WORKSPACE"
          dotnet run --project src/CodeMonitor/CodeMonitor.csproj -c Release -f net8.0 --no-build -- \
            --path "$GITHUB_WORKSPACE" \
            --base-ref "$BASE_REF" \
            --pr-number "$PR_NUMBER" \
            --pr-url "$PR_URL" \
            --pr-author "$PR_AUTHOR_EMAIL"

      - name: 💬 Post PR Comment & File GitHub Issue for Warnings
        if: always()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const fs = require('fs');

            // 1. Post/Update Pull Request Review Comment (if PR event)
            if (context.eventName === 'pull_request' && fs.existsSync('pr-comment.md')) {
              const body = fs.readFileSync('pr-comment.md', 'utf8');
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              
              const botComment = comments.find(comment => 
                comment.body.includes('Code Quality Gate:') || 
                comment.body.includes('Code Quality Check:')
              );
              
              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: body
                });
                console.log('Updated existing PR quality comment.');
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body
                });
                console.log('Created new PR quality comment.');
              }
            }

            // 2. File a GitHub Issue under the repository Issues tab for Warnings (.md format with timestamp)
            const warningsFile = 'issues/latest_warnings.md';
            if (fs.existsSync(warningsFile)) {
              const warningsBody = fs.readFileSync(warningsFile, 'utf8');
              if (warningsBody.includes('Summary of Advisory Warnings')) {
                const timestamp = new Date().toISOString().replace('T', ' ').substring(0, 19);
                const prSuffix = process.env.PR_NUMBER ? ` [PR #${process.env.PR_NUMBER}]` : ` [Branch: ${context.ref.replace('refs/heads/', '')}]`;
                const issueTitle = `⚠️ Code Quality Advisory Warnings${prSuffix} - ${timestamp} UTC`;

                try {
                  const { data: existingIssues } = await github.rest.issues.listForRepo({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    state: 'open',
                    labels: 'code-quality-advisory'
                  });

                  const existingAdvisory = existingIssues.find(i => 
                    process.env.PR_NUMBER ? i.title.includes(`PR #${process.env.PR_NUMBER}`) : i.title.includes(context.ref.replace('refs/heads/', ''))
                  );

                  if (existingAdvisory) {
                    await github.rest.issues.update({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: existingAdvisory.number,
                      title: issueTitle,
                      body: warningsBody
                    });
                    console.log(`Updated open GitHub Issue #${existingAdvisory.number} with latest warnings.`);
                  } else {
                    const { data: newIssue } = await github.rest.issues.create({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      title: issueTitle,
                      body: warningsBody,
                      labels: ['code-quality', 'code-quality-advisory', 'warnings']
                    });
                    console.log(`Successfully created GitHub Issue #${newIssue.number}: ${newIssue.html_url}`);
                  }
                } catch (issueErr) {
                  console.log(`Note: Could not file GitHub Issue (${issueErr.message}). Report is saved in repository issues/ folder.`);
                }
              }
            }

      - name: 📦 Archive Warnings Report (.md)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-quality-warnings-report
          path: issues/
          if-no-files-found: ignore
